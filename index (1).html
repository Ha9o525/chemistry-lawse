<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="قوانين الكيمياء">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>قوانين الكيمياء – الحركية الكيميائية</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mut:#5d6779;--ac:#0f7b6c;--ac2:#e8f5f2;--bd:#e1e5ee;--hl:#fff3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#18202e;--tx:#e8ecf4;--mut:#9aa6bb;--ac:#4fd1bd;--ac2:#16302e;--bd:#2a3447;--hl:#4a4116}}
:root[data-theme="dark"]{--bg:#10151f;--card:#18202e;--tx:#e8ecf4;--mut:#9aa6bb;--ac:#4fd1bd;--ac2:#16302e;--bd:#2a3447;--hl:#4a4116}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7;padding-bottom:190px}
header{padding:22px 16px 8px;text-align:center}
h1{margin:0;font-size:1.5rem;color:var(--ac)}
header p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--bd)}
nav a{white-space:nowrap;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:.85rem}
nav a:hover{border-color:var(--ac);color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:12px}
section{margin:18px 0}
h2{font-size:1.15rem;margin:0 0 10px;padding-right:10px;border-right:4px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:1rem}
.fm{direction:ltr;text-align:center;background:var(--ac2);border-radius:8px;padding:8px 6px;margin:6px 0;font-size:1.2rem;font-family:"Times New Roman",serif;overflow-x:auto;white-space:nowrap}
.lb{font-size:.8rem;color:var(--mut);text-align:right;margin-top:6px}
.s{cursor:pointer;border-bottom:1.5px dashed var(--ac);padding:0 2px;border-radius:3px;font-style:italic}
.s:hover,.s.on{background:var(--hl)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}
.fr i{font-style:normal;padding:0 4px}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips .s{border:1px solid var(--bd);background:var(--card);font-style:normal;padding:0 8px;border-radius:14px;font-size:.9rem}
.note{font-size:.88rem;color:var(--mut);margin:6px 0 0}
.card p{margin:4px 0;font-size:.93rem}
#pop{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:3px solid var(--ac);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s}
#pop.open{transform:none}
#pop .in{max-width:860px;margin:auto;display:flex;gap:14px;align-items:center}
#psym{font-size:2rem;font-family:"Times New Roman",serif;min-width:62px;text-align:center;color:var(--ac);direction:ltr}
#pn{font-weight:700}
#pd{color:var(--tx);font-size:.93rem}
#pu{margin-top:2px;font-size:.9rem;color:var(--ac);font-weight:700}
#px{margin-inline-start:auto;border:0;background:var(--ac2);color:var(--tx);border-radius:50%;width:32px;height:32px;font-size:1rem;cursor:pointer}
/* iPhone / Liquid Glass style */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:16px}
:root{--g:rgba(255,255,255,.55);--gb:rgba(255,255,255,.7);--gs:0 8px 30px rgba(20,60,55,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:rgba(34,44,60,.5);--gb:rgba(255,255,255,.12);--gs:0 8px 30px rgba(0,0,0,.4)}}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,"Noto Naskh Arabic",sans-serif;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle at 85% 0%,rgba(79,209,189,.35),transparent 45%),radial-gradient(circle at 5% 40%,rgba(120,150,255,.25),transparent 45%),radial-gradient(circle at 90% 85%,rgba(255,190,120,.22),transparent 45%),var(--bg);background-attachment:fixed;padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}
header{text-align:right;padding:28px 20px 6px;max-width:860px;margin:auto}
h1{font-size:2rem;font-weight:800;letter-spacing:-.3px}
h2{border:0;padding:0 6px;font-size:1.3rem;font-weight:700}
.card,nav,#pop{background:var(--g);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--gs)}
.card{border-radius:26px;padding:16px}
.card h3{font-size:1.05rem;font-weight:700}
.fm{font-size:1.35rem;border-radius:18px;padding:14px 10px;-webkit-overflow-scrolling:touch}
.s{padding:4px 5px;border-bottom:0;background:rgba(15,123,108,.1);border-radius:8px;margin:0 1px;touch-action:manipulation}
.s.on{background:var(--hl);outline:2px solid var(--ac)}
.chips{gap:8px}
.chips .s{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:20px;font-size:1rem;background:var(--ac2)}
nav{position:fixed;top:auto;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:32px;padding:6px;gap:4px;scrollbar-width:none;overscroll-behavior-x:contain;z-index:20}
nav::-webkit-scrollbar{display:none}
nav a{border:0;background:transparent;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:26px;font-size:.95rem;font-weight:600;color:var(--mut)}
nav a.act{background:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav a.act{color:#06231f}}
#pop{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);border-radius:28px;border-top:1px solid var(--gb);padding:16px;transform:translateY(160%);z-index:30}
#pop.open{transform:none}
#psym{font-size:2.2rem}
#pd{font-size:1rem}
#px{width:44px;height:44px;flex:none}
@media (min-width:700px){nav{left:50%;right:auto;transform:translateX(-50%);max-width:820px;width:calc(100% - 24px)}#pop{max-width:836px;margin:auto}}
</style>
</head>
<body>
<header><h1>قوانين الكيمياء – الحركية الكيميائية</h1><p>اضغط على أي رمز في القانون لعرض تعريفه ووحدته</p></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="pop"><div class="in"><div id="psym"></div><div><div id="pn"></div><div id="pd"></div><div id="pu"></div></div><button id="px" aria-label="إغلاق">✕</button></div></div>
<script>
(function(){
const $=i=>document.getElementById(i),psym=$('psym'),pn=$('pn'),pd=$('pd'),pu=$('pu'),px=$('px');
const D={
n:['n','كمية المادة','عدد المولات من النوع الكيميائي.','mol'],
m:['m','الكتلة','كتلة العينة.','g'],
M:['M','الكتلة المولية','كتلة مول واحد من النوع الكيميائي.','g/mol'],
V:['V','الحجم','حجم الغاز أو المحلول.','L (وفي قانون الغازات: m³)'],
Vm:['V<sub>m</sub>','الحجم المولي','حجم مول واحد من الغاز، ويساوي 22.4 L/mol في الشروط النظامية.','L/mol'],
N:['N','عدد الدقائق','عدد الأفراد الكيميائية (جزيئات، ذرات، شوارد).','بدون وحدة'],
NA:['N<sub>A</sub>','عدد أفوغادرو','عدد الدقائق في مول واحد: 6.023×10²³.','mol⁻¹'],
C:['C','التركيز المولي','كمية المادة المذابة في وحدة الحجم.','mol/L'],
Cm:['C<sub>m</sub>','التركيز الكتلي','كتلة المذاب في وحدة الحجم.','g/L'],
P:['P','الضغط','ضغط الغاز.','Pa (باسكال)'],
T:['T','درجة الحرارة المطلقة','درجة الحرارة بالكلفن.','K (كلفن)'],
R:['R','ثابت الغازات المثالية','قيمته 8.314.','J.mol⁻¹.K⁻¹'],
G:['G','الناقلية','قياس قدرة المحلول على نقل التيار الكهربائي.','S (سيمنس)'],
I:['I','شدة التيار','شدة التيار المار في الخلية.','A'],
U:['U','التوتر الكهربائي','التوتر بين لبوسي الخلية.','V'],
s:['σ','الناقلية النوعية','ناقلية المحلول في وحدة الطول والمساحة.','S/m'],
S:['S','مساحة سطح الخلية','مساحة سطح اللبوس المغمور.','m²'],
L:['L','المسافة بين اللبوسين','البعد بين لبوسي خلية قياس الناقلية.','m'],
l:['λ','الناقلية المولية الشاردية','ناقلية مول من الشاردة.','S.m².mol⁻¹'],
c:['[X]','التركيز المولي للشاردة','تركيز الشاردة في المحلول.','mol/m³ (في قانون الناقلية)'],
x:['x','تقدم التفاعل','كمية المادة المتفاعلة أو المتشكلة بدلالة المعاملات الستوكيومترية.','mol'],
xm:['x<sub>max</sub>','التقدم الأعظمي','قيمة التقدم عند نهاية التفاعل.','mol'],
t:['t','الزمن','الزمن المنقضي منذ بداية التفاعل.','s'],
th:['t<sub>1/2</sub>','زمن نصف التفاعل','الزمن اللازم لبلوغ التقدم نصف قيمته الأعظمية.','s'],
v:['v','سرعة التفاعل','معدل تغير التقدم بدلالة الزمن.','mol/s'],
vm:['v<sub>m</sub>','السرعة المتوسطة','سرعة التشكل أو الاختفاء خلال المجال Δt.','mol/s'],
vV:['v','السرعة الحجمية','سرعة التفاعل في وحدة الحجم.','mol.L⁻¹.s⁻¹'],
vi:['v','السرعة اللحظية للنوع','سرعة تشكل أو اختفاء النوع الكيميائي المعني.','mol/s'],
VT:['V<sub>T</sub>','الحجم الكلي للتفاعل','الحجم الكلي للمزيج التفاعلي.','L'],
dn:['dn','تغير تفاضلي في كمية المادة','تغير صغير جدا في كمية المادة.','mol'],
dx:['dx','تغير تفاضلي في التقدم','تغير صغير جدا في التقدم.','mol'],
dC:['dC','تغير تفاضلي في التركيز','تغير صغير جدا في التركيز.','mol/L'],
dt:['dt','تغير تفاضلي في الزمن','مدة زمنية صغيرة جدا.','s'],
Dn:['Δn','التغير في كمية المادة','الفرق بين كمية المادة النهائية والابتدائية.','mol'],
Dt:['Δt','المجال الزمني','المدة بين لحظتين.','s'],
k:['a, b, c, d','المعاملات الستوكيومترية','أعداد في المعادلة المتوازنة.','بدون وحدة'],
nA:['n<sub>A</sub>','كمية مادة A','كمية مادة المتفاعل A عند التكافؤ.','mol'],
nB:['n<sub>B</sub>','كمية مادة B','كمية مادة المتفاعل B عند التكافؤ.','mol']
};
// {key} or {key:html}; [[top|bot]] fraction
const F=s=>s.replace(/\{(\w+)(?::([^}]*))?\}/g,(_,k,o)=>`<span class="s" data-k="${k}">${o||D[k][0]}</span>`).replace(/\[\[(.*?)\|(.*?)\]\]/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
const S=[
['q','كمية المادة',[
{t:'العلاقات الثلاث',f:[['بدلالة الكتلة','{n} = [[{m}|{M}]]'],['بدلالة حجم الغاز','{n} = [[{V}|{Vm}]]'],['بدلالة عدد الدقائق','{n} = [[{N}|{NA}]]']],note:'Vm = 22.4 L/mol في الشروط النظامية، و NA = 6.023×10²³.'}]],
['c','التركيز',[
{t:'التركيز المولي',f:[['','{C} = [[{n}|{V}]]']]},
{t:'التركيز الكتلي',f:[['','{Cm} = [[{m}|{V}]]']]}]],
['g','قانون الغازات',[
{t:'قانون الغاز المثالي',f:[['','{P}·{V} = {n}·{R}·{T}']],note:'الضغط بالباسكال، والحجم بالمتر المكعب، ودرجة الحرارة بالكلفن.'}]],
['k','الناقلية',[
{t:'الناقلية والناقلية النوعية',f:[['','{G} = [[{I}|{U}]] = {s} × [[{S}|{L}]]']],note:'نقيس بها تقدم التفاعل: بواسطة قياس الناقلية G أو الناقلية النوعية σ.'},
{t:'قانون كولراوش',f:[['','{s} = {l}:λ<sub>M⁺</sub>[M⁺] + λ<sub>M⁻</sub>[M⁻]']],note:'التركيز بوحدة mol/m³، و λ بوحدة S.m².mol⁻¹.'}]],
['r','المؤكسد والمرجع',[
{p:'<b>المؤكسد:</b> هو كل فرد كيميائي بإمكانه كسب إلكترونات.'},
{p:'<b>المرجع:</b> هو كل فرد كيميائي بإمكانه فقد إلكترونات.'}]],
['d','مدة التحول والمتابعة',[
{t:'المدة المستغرقة لتحول كيميائي',p:'<b>سريع:</b> يحدث آنيا.<br><b>بطيء:</b> يستغرق ثوان، دقائق أو ساعات.<br><b>بطيء جدا:</b> يستغرق أياما أو أشهرا.'},
{t:'المتابعة الزمنية',p:'<b>طريقة قياس الناقلية:</b> يمكن متابعة تقدم التفاعل بواسطة قياس الناقلية G أو الناقلية النوعية σ.<br><b>طريقة المعايرة:</b> هي تحديد تركيز نوع كيميائي مجهول في محلول.'},
{t:'التكافؤ',f:[['المعادلة: aA + bB = cC + dD','[[{nA}|a]] = [[{nB}|b]]']],note:'نحصل على التكافؤ عندما يكون المزيج المتفاعل ستوكيومتريا، ويكون التفاعل تاما في هذه الحالة.'}]],
['v','سرعة التفاعل',[
{t:'السرعة المتوسطة',f:[['لتشكل نوع كيميائي','{vm} = [[{Dn}|{Dt}]]'],['لاختفاء نوع كيميائي','{vm} = −[[{Dn}|{Dt}]]']]},
{t:'السرعة اللحظية',f:[['لتشكل النوع C','{v:v<sub>C</sub>} = [[{dn:dn<sub>C</sub>}|{dt}]]'],['لاختفاء النوع A','{v:v<sub>A</sub>} = −[[{dn:dn<sub>A</sub>}|{dt}]]']]},
{t:'السرعة الحجمية',f:[['لتشكل النوع C','{vV:v<sub>C</sub>} = [[1|{VT}]]·[[{dn:dn<sub>C</sub>}|{dt}]]'],['لاختفاء النوع A','{vV:v<sub>A</sub>} = −[[1|{VT}]]·[[{dn:dn<sub>A</sub>}|{dt}]]']],note:'الوحدة: mol.L⁻¹.s⁻¹.'},
{t:'سرعة التفاعل',f:[['بدلالة التقدم','{v} = [[{dx}|{dt}]]'],['السرعة الحجمية للتفاعل','{vV} = [[1|{VT}]]·[[{dx}|{dt}]] = [[{dC}|{dt}]]']],note:'C هو تركيز المحلول. وحدة السرعة: mol/s، ووحدة السرعة الحجمية: mol.L⁻¹.s⁻¹.'},
{t:'العلاقة بين السرع',f:[['المعادلة: aA + bB = cC + dD','[[{vi:v<sub>A</sub>}|a]] = [[{vi:v<sub>B</sub>}|b]] = [[{vi:v<sub>C</sub>}|c]] = [[{vi:v<sub>D</sub>}|d]]']],note:'تعتبر هذه العلاقة صحيحة للتفاعل النموذجي بالمعادلة المذكورة.'}]],
['h','زمن نصف التفاعل',[
{t:'التعريف',f:[['','{x}({th}) = [[{xm}|2]]']],note:'هو الزمن اللازم لبلوغ التفاعل نصف تقدمه الأعظمي.'}]],
['f','العوامل الحركية',[
{t:'درجة الحرارة',p:'الجملة تتطور بسرعة أكبر كلما ارتفعت درجة الحرارة.'},
{t:'التركيز الابتدائي',p:'الجملة تتطور بشكل أسرع كلما زدنا في أحد تراكيز أحد المتفاعلات.'},
{t:'الوسيط',p:'نوع كيميائي يسرع التفاعل ولكن لا يدخل كطرف فيه، وله عدة أنواع:<br>• <b>متجانس:</b> لا يمكن التمييز بينه وبين باقي المتفاعلات.<br>• <b>غير متجانس:</b> ليس من نفس طبيعة المتفاعلات.<br>• <b>إنزيمي:</b> الإنزيمات عوامل هامة في البيولوجيا، وفي الصناعة الغذائية تستعمل الإنزيمات في تحضير الجبنة والخمور.'},
{t:'التفسير المجهري',p:'الزيادة في أحد التراكيز الابتدائية تؤدي إلى زيادة في كمية المتفاعلات، وبالتالي الزيادة في التصادمات بين الجزيئات، وبالتالي تزداد الطاقة الحركية المجهرية، مما يؤدي إلى زيادة في سرعة التفاعل.'}]]
];
const T={q:'كمية المادة',c:'التركيز',g:'الغازات',k:'الناقلية',r:'أكسدة وإرجاع',d:'التحول والمتابعة',v:'السرعة',h:'نصف التفاعل',f:'العوامل الحركية'};
const nav=$('nav'),main=$('main');
S.forEach(([id,title,cards])=>{
 nav.insertAdjacentHTML('beforeend',`<a href="#${id}">${T[id]}</a>`);
 let h=`<section id="${id}"><h2>${title}</h2><div class="grid">`;
 cards.forEach(c=>{
  let body='',keys=new Set();
  (c.f||[]).forEach(([lb,fm])=>{(fm.match(/\{(\w+)/g)||[]).forEach(k=>keys.add(k.slice(1)));body+=(lb?`<div class="lb">${lb}</div>`:'')+`<div class="fm">${F(fm)}</div>`});
  if(c.p)body+=`<p>${c.p}</p>`;
  if(c.note)body+=`<p class="note">${c.note}</p>`;
  if(keys.size)body+=`<div class="chips">${[...keys].map(k=>`<span class="s" data-k="${k}">${D[k][0]}</span>`).join('')}</div>`;
  h+=`<div class="card">${c.t?`<h3>${c.t}</h3>`:''}${body}</div>`;
 });
 main.insertAdjacentHTML('beforeend',h+'</div></section>');
});
const pop=$('pop');let cur=null;
document.addEventListener('click',e=>{
 const el=e.target.closest('.s');
 if(!el){if(!e.target.closest('#pop'))close();return}
 const k=el.dataset.k,d=D[k];if(!d)return;
 document.querySelectorAll('.s.on').forEach(x=>x.classList.remove('on'));
 el.classList.add('on');cur=el;
 psym.innerHTML=el.classList.contains('s')&&el.parentElement.classList.contains('chips')?d[0]:el.innerHTML;
 pn.textContent=d[1];pd.textContent=d[2];pu.textContent='وحدة الاستعمال: '+d[3];
 pop.classList.add('open');
});
function close(){pop.classList.remove('open');document.querySelectorAll('.s.on').forEach(x=>x.classList.remove('on'))}
px.onclick=close;
const links=[...nav.querySelectorAll('a')];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>{const on=a.getAttribute('href')==='#'+e.target.id;a.classList.toggle('act',on);if(on)a.scrollIntoView({inline:'center',block:'nearest'})})}})},{rootMargin:'-20% 0px -65% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
links[0]&&links[0].classList.add('act');
})();

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
